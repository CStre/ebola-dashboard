name: Update outbreak data

on:
  schedule:
    # 12:00 UTC = 08:00 ET (EDT) / 07:00 ET (EST)
    # 22:00 UTC = 18:00 ET (EDT) / 17:00 ET (EST)
    # Cron has no timezone support — these float by 1h across DST boundaries.
    - cron: '0 12 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain data/outbreak.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/outbreak.json
            git commit -m "data: auto-refresh outbreak figures ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No data changes — skipping commit."
          fi
